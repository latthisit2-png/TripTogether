version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: triptogether_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triptogether}
      POSTGRES_USER: ${POSTGRES_USER:-triptogether_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triptogether_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triptogether_user} -d ${POSTGRES_DB:-triptogether}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: triptogether_postgres_data
